<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Gloss Highlight Gradient -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Food Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#312E81" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Glass Inner Glow Border -->
  <rect x="25" y="25" width="462" height="462" rx="111" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="3" />

  <!-- Top Sheen Overlay -->
  <path d="M 24 136 C 24 74, 74 24, 136 24 L 376 24 C 438 24, 488 74, 488 136 C 488 190, 370 230, 256 230 C 142 230, 24 190, 24 136 Z" fill="url(#glossGrad)" />

  <!-- Center Icon: Stylized Cutlery & Food Bite Motif -->
  <g transform="translate(136, 126)" stroke="none">
    <!-- Plate / Dish Circle Rim -->
    <circle cx="120" cy="130" r="105" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="12" stroke-dasharray="14 10" />

    <!-- Solid Dining Tray Glow -->
    <circle cx="120" cy="130" r="85" fill="#FFFFFF" fill-opacity="0.12" />

    <!-- Crossed Fork & Spoon with Dynamic Dining Energy -->
    <!-- Left: Fork -->
    <g transform="rotate(-25 120 130)">
      <path d="M 88 40 L 88 95 C 88 115 102 130 115 132 L 115 210 C 115 216 119 220 125 220 C 131 220 135 216 135 210 L 135 132 C 148 130 162 115 162 95 L 162 40 C 162 36 158 32 154 32 C 150 32 146 36 146 40 L 146 80 C 146 84 142 88 138 88 C 134 88 130 84 130 80 L 130 40 C 130 36 126 32 122 32 C 118 32 114 36 114 40 L 114 80 C 114 84 110 88 106 88 C 102 88 98 84 98 80 L 98 40 C 98 36 94 32 90 32 C 86 32 88 36 88 40 Z" fill="#FFFFFF" />
    </g>

    <!-- Right: Spoon with Bite Mark Accent -->
    <g transform="rotate(25 120 130)">
      <path d="M 120 30 C 95 30 78 55 78 85 C 78 115 98 132 114 135 L 114 210 C 114 216 118 220 124 220 C 130 220 134 216 134 210 L 134 135 C 150 132 170 115 170 85 C 170 55 145 30 120 30 Z" fill="#FFFFFF" fill-opacity="0.95" />
    </g>

    <!-- Golden Sparkle / Campus Star Motif -->
    <path d="M 195 50 Q 195 72 215 72 Q 195 72 195 94 Q 195 72 175 72 Q 195 72 195 50 Z" fill="url(#accentGrad)" />
    <path d="M 50 170 Q 50 182 62 182 Q 50 182 50 194 Q 50 182 38 182 Q 50 182 50 170 Z" fill="url(#accentGrad)" />
  </g>

  <!-- Small Bottom Brand Tag -->
  <text x="256" y="440" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="4" text-anchor="middle" opacity="0.95">CAMPUSBITES</text>
</svg>

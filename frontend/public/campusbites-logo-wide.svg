<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="wideBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Star Accent -->
    <linearGradient id="wideAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="wideShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4F46E5" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Left Icon Emblem (Squircle) -->
  <g transform="translate(20, 20)">
    <rect width="120" height="120" rx="32" fill="url(#wideBgGrad)" filter="url(#wideShadow)" />
    <rect x="1" y="1" width="118" height="118" rx="31" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" />
    
    <!-- Cutlery Motif -->
    <g transform="translate(28, 26) scale(0.28)">
      <circle cx="120" cy="130" r="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="12" stroke-dasharray="14 10" />
      <g transform="rotate(-25 120 130)">
        <path d="M 88 40 L 88 95 C 88 115 102 130 115 132 L 115 210 C 115 216 119 220 125 220 C 131 220 135 216 135 210 L 135 132 C 148 130 162 115 162 95 L 162 40 C 162 36 158 32 154 32 C 150 32 146 36 146 40 L 146 80 C 146 84 142 88 138 88 C 134 88 130 84 130 80 L 130 40 C 130 36 126 32 122 32 C 118 32 114 36 114 40 L 114 80 C 114 84 110 88 106 88 C 102 88 98 84 98 80 L 98 40 C 98 36 94 32 90 32 C 86 32 88 36 88 40 Z" fill="#FFFFFF" />
      </g>
      <g transform="rotate(25 120 130)">
        <path d="M 120 30 C 95 30 78 55 78 85 C 78 115 98 132 114 135 L 114 210 C 114 216 118 220 124 220 C 130 220 134 216 134 210 L 134 135 C 150 132 170 115 170 85 C 170 55 145 30 120 30 Z" fill="#FFFFFF" />
      </g>
      <path d="M 195 50 Q 195 72 215 72 Q 195 72 195 94 Q 195 72 175 72 Q 195 72 195 50 Z" fill="url(#wideAccentGrad)" />
    </g>
  </g>

  <!-- Typography Right Side -->
  <g transform="translate(165, 82)">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#1E1B4B" letter-spacing="-1">
      Campus<tspan fill="url(#wideBgGrad)">Bites</tspan>
    </text>
    <text y="34" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="14" fill="#6366F1" letter-spacing="3">
      COLLEGE CANTEEN HUB
    </text>
  </g>
</svg>

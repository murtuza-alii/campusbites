services:
  # ==============================================================================
  # CampusBites Backend (Web Service)
  # ==============================================================================
  - type: web
    name: campusbites-backend
    runtime: node
    plan: starter # or free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard or attach Render Postgres
      - key: REDIS_URL
        sync: false # Set in Render Dashboard (e.g. Upstash Redis URL)
      - key: STAFF_PASSWORD
        value: admin123

  # ==============================================================================
  # CampusBites Frontend (Static Site)
  # ==============================================================================
  - type: web
    name: campusbites-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Point to https://<your-backend-name>.onrender.com
